[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "job-spy-bot"
version = "1.0.0"
description = "Telegram-бот для мониторинга вакансий в BY / RU / KZ / GE / PL с ИИ-анализом"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "luxsordel" }]
# Зависимости намеренно минимальны: бот должен жить на VPS с маленьким объёмом RAM.
dependencies = [
    "httpx>=0.27,<1",
    "selectolax>=1.0",
    "pypdf>=5",  # чтение резюме; импортируется только при загрузке файла
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
job-spy-bot = "jobspybot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobspybot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# новые версии ruff форматируют и код в Markdown — примеры в документации оставляем как есть
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
